<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trenul lui Bubu</title>
  <meta name="description" content="Trenul lui Bubu: călătorii cu trenul prin România, cu misiuni în gări și pe drum. Un joc pentru copii, pe calculator, tabletă și telefon.">
  <meta name="theme-color" content="#13295a">
  <link rel="icon" href="shared/assets/favicon.ico" sizes="48x48">
  <link rel="icon" href="shared/assets/icon-192.png" type="image/png" sizes="192x192">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared/css/tokens.css">
  <link rel="stylesheet" href="home/home.css">
  <!-- the season (from the calendar, or ?anotimp=vara): marks <html> before the page is drawn -->
  <script src="home/season.js"></script>
</head>
<body>
  <header class="home-hero">
    <!-- the season's landscape is drawn here by home/home.js (home/landscape.js) -->
    <div class="home-scene" id="scene"></div>
    <!-- the game is published inside lumea-lui-bubu (in its folder trenul-lui-bubu/): back to the village -->
    <a class="home-back" href="../"><span aria-hidden="true">←</span> Lumea lui Bubu</a>
    <div class="home-head">
      <!-- the name of the game on a station's name board, with Bubu sitting on it -->
      <div class="home-sign">
        <h1 class="home-title">Trenul lui Bubu</h1>
        <p class="home-subtitle">Alege o călătorie!</p>
        <img class="home-bubu" src="shared/assets/bubu.webp" alt="" width="120" height="120">
      </div>
    </div>
  </header>

  <main class="home-main">
    <!-- the scenery behind the cards (home/home.js) -->
    <div class="home-ground" id="ground"></div>
    <!-- the journeys are listed by home/home.js (from home/routes.js) -->
    <ol class="route-list" id="routes" aria-label="Călătoriile">
      <li><a class="route-card route-card--plain" href="route-01/">Ruta 1 · Drumul de Crăciun (Timișoara → Putna)</a></li>
    </ol>
  </main>

  <footer class="home-foot">
    <p>Progresul se salvează doar în acest browser.</p>
    <p class="home-author">prof. ing. Robert Ștefan</p>
  </footer>

  <!-- shows that there are journeys below the screen (home/home.js) -->
  <button class="scroll-hint" id="scroll-hint" type="button" hidden>Vezi toate călătoriile <span aria-hidden="true">↓</span></button>

  <noscript><p class="home-foot">Pentru joc trebuie activat JavaScript în browser.</p></noscript>
  <script type="module" src="home/home.js"></script>
</body>
</html>
